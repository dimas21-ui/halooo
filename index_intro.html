<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selamat Ulang Tahun</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .glow-text {
      font-size: 3.5rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #fff;
      text-align: center;
      animation: flicker 3s infinite;
      text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #0ff;
    }

    @keyframes flicker {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.7;
      }
    }

    .subtext {
      margin-top: 15px;
      font-size: 1.5rem;
      color: #eee;
      text-align: center;
      opacity: 0.85;
    }

    .birthday-photo {
      margin-top: 30px;
      width: 250px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.7);
      transition: transform 0.3s ease;
    }

    .birthday-photo:hover {
      transform: scale(1.05);
    }

    .enter-button {
      margin-top: 40px;
      padding: 15px 30px;
      font-size: 1.2rem;
      color: #0f2027;
      background: #00ffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease-in-out;
      box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
    }

    .enter-button:hover {
      background: #0ff;
      transform: scale(1.05);
    }

    .particle-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: moveBg 60s linear infinite;
      z-index: -1;
    }

    @keyframes moveBg {
      from { background-position: 0 0; }
      to { background-position: 1000px 1000px; }
    }
  </style>
</head>
<body>
  <div class="particle-bg"></div>
  <div class="glow-text">Hallo nadiaa 🥰</div>
  <div class="subtext">pasti lagi cape ko ini hari, semoga ada hal kecil hari ini yang bisa bikin ko senyum lagi.</div>
  <img src="image.png" alt="Foto Nadia" class="birthday-photo">
  <a href="flower.html"><button class="enter-button">pencet kalau bisa</button></a>
</body>
</html>
